# Starship prompt configuration
# Managed by: /mnt/local/projects/dotfiles

add_newline = true
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_status\
$package\
$rust\
$python\
$nodejs\
$golang\
$cmd_duration\
$line_break\
$character"""

[directory]
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
format = "on [$symbol$branch(:$remote_branch)]($style) "

[git_status]
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[package]
symbol = "📦 "
format = "is [$symbol$version]($style) "

[rust]
symbol = "🦀 "
format = "via [$symbol$version]($style) "

[python]
symbol = "🐍 "
format = "via [$symbol$version]($style) "

[nodejs]
symbol = " "
format = "via [$symbol$version]($style) "

[golang]
symbol = " "
format = "via [$symbol$version]($style) "

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

matches:
  # Systemd - Suspend / Hibernate

  - trigger: ":suspend"
    replace: "systemctl suspend"

  - trigger: ":hibernate"
    replace: "systemctl hibernate"

  - trigger: ":suspend30"
    replace: "systemd-run --user --on-active=30m systemctl suspend"

  - trigger: ":hibernate1h"
    replace: "systemd-run --user --on-active=1h systemctl hibernate"

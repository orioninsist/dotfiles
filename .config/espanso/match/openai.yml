# ============================================================
# markdownMerge checks
# Check generated AI packages
# ============================================================


  - trigger: :openaimergecheck
    replace: |
      cat /home/murat/Media/5-Documentation/openai/merge/openai.com/summary.txt && \
      echo && \
      cat /home/murat/Media/5-Documentation/openai/merge/openai.com/validation.txt


  - trigger: :openaimergemanifest

- trigger: :ytsub
  replace: "{{result}}"
  vars:
    - name: form
      type: form
      params:
        layout: |
          Dil: [[lang]]
          URL: [[url]]
        fields:
          lang:
            type: list
            values:
              - tr
              - en
              - de
          url:
            type: text
    - name: result
      type: shell
      params:
        shell: bash
        cmd: |
          mkdir -p /home/murat/.subs
          lang="{{form.lang}}"
          case "$lang" in
            tr) langs="tr,tr-*,tur" ;;
            en) langs="en,en-*,eng" ;;
            de) langs="de,de-*,ger,deu" ;;
            *)  langs="$lang" ;;
          esac
          yt-dlp             --skip-download             --write-subs             --write-auto-subs             --sub-langs "$langs"             --sub-format "srt/best"             --convert-subs srt             -o "/home/murat/.subs/%(title)s [%(id)s].%(ext)s"             "{{form.url}}"

- trigger: :ytvideo
  replace: "{{result}}"
  vars:
    - name: form
      type: form
      params:
        layout: |
          Kalite: [[quality]]
          URL: [[url]]
        fields:
          quality:
            type: list
            values:
              - best
              - 1080p
              - 1440p
              - 2160p
              - 720p
          url:
            type: text
    - name: result
      type: shell
      params:
        shell: bash
        cmd: |
          mkdir -p /home/murat/.video
          q="{{form.quality}}"
          case "$q" in
            best)
              fmt="bv*+ba/b"
              ;;
            2160p)
              fmt="bv*[height<=2160]+ba/b[height<=2160]"
              ;;
            1440p)
              fmt="bv*[height<=1440]+ba/b[height<=1440]"
              ;;
            1080p)
              fmt="bv*[height<=1080]+ba/b[height<=1080]"
              ;;
            720p)
              fmt="bv*[height<=720]+ba/b[height<=720]"
              ;;
          esac
          yt-dlp             -f "$fmt"             --merge-output-format mp4             --remux-video mp4             -o "/home/murat/.video/%(title)s [%(id)s].%(ext)s"             "{{form.url}}"


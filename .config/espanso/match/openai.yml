# ============================================================
# markdownMerge project
# Markdown docs -> LLM context packages
#
# Project:
# /home/murat/Media/6-Project/markdownMerge
#
# Tokenizer:
# o200k_base
#
# Output:
# - Markdown context files
# - manifest.json
# - summary.txt
# - validation.txt
# ============================================================


  - trigger: :openaidevelopersmerge
    replace: |
      cd /home/murat/Media/6-Project/markdownMerge && uv run mdmerge \
      /home/murat/Media/5-Documentation/openai/docs/developers.openai.com \
      /home/murat/Media/5-Documentation/openai/merge/developers.openai.com \
      --name developers \
      --token-limit 120000 \
      --reserve-tokens 5000 \
      --encoding o200k_base


  - trigger: :openaiacademymerge
    replace: |
      cd /home/murat/Media/6-Project/markdownMerge && uv run mdmerge \
      /home/murat/Media/5-Documentation/openai/docs/academy.openai.com \

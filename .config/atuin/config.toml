# Atuin — focused local history configuration
# Managed by: https://github.com/orioninsist/dotfiles

# This machine currently uses Atuin locally; avoid unnecessary network checks.
auto_sync = false
update_check = false

# Fast, forgiving history search.
search_mode = "fuzzy"

# Search all history with Ctrl-R, while Up Arrow stays focused on this shell session.
filter_mode = "global"
filter_mode_shell_up_key_binding = "session"
search_mode_shell_up_key_binding = "fuzzy"

# Treat the whole Git repository as one useful history context when cycling filters.
workspaces = true

# Keep the UI useful without taking over the whole terminal.
style = "compact"
inline_height = 20
inline_height_shell_up_key_binding = 12
show_preview = true
max_preview_height = 4
show_help = true
show_tabs = true
show_numeric_shortcuts = true

# Enter executes the selected history entry; Tab/Right Arrow leaves it for editing.
enter_accept = true

# When searching after &&, ||, or |, complete the next command instead of replacing the line.
command_chaining = true

# Keep history clean and retain Atuin's built-in credential protection.
strip_trailing_whitespace = true
secrets_filter = true

# We build/install Atuin ourselves, so a slightly longer SQLite acquisition timeout
# is preferable to failing immediately during short-lived shell/database contention.
local_timeout = "5s"

[stats]
common_subcommands = [
  "cargo",
  "git",
  "npm",
  "pnpm",
  "systemctl",
]
common_prefix = ["sudo"]
ignored_commands = ["cd", "ls", "clear"]

[keys]
scroll_exits = true
exit_past_line_start = true
accept_past_line_end = true

[sync]
records = true

[preview]
strategy = "auto"

# No daemon is needed for the current local fuzzy-search setup.
[daemon]
enabled = false
autostart = false

[search]
filters = ["global", "session", "session-preload", "workspace", "directory", "host"]

[tmux]
enabled = false

[ui]
columns = [
  "duration",
  "time",
  { type = "directory", width = 24 },
  "command",
]

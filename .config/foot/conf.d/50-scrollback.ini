# ==============================================================================
# SCROLLBACK
# ==============================================================================
#
# The active main configuration already defines:
# lines=10000
# multiplier=3.0
#
# They are intentionally not duplicated here.

[scrollback]

# Controls the scrollback position indicator.
#
# Values:
# none     = disable the indicator
# fixed    = always show it near the top of the window
# relative = show it according to the current scrollback position
#
# Default: relative
# indicator-position=relative

# Controls the contents of the scrollback position indicator.
#
# Values:
# percentage = display the current position as a percentage
# line       = display the current line
# any other value is treated as a custom fixed string
#
# Ignored when indicator-position=none.
#
# Default: empty string
# indicator-format=

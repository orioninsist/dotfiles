# ==============================================================================
# MOUSE BINDINGS
# ==============================================================================
#
# Mouse buttons, wheel events and modifier combinations can be mapped to
# actions.
#
# Wheel button names:
# BTN_WHEEL_BACK    = wheel up
# BTN_WHEEL_FORWARD = wheel down
# BTN_WHEEL_LEFT    = horizontal wheel left
# BTN_WHEEL_RIGHT   = horizontal wheel right
#
# A modifier+button combination can only be mapped to one action.
# Existing default bindings can be disabled by assigning the action to "none".

[mouse-bindings]

# Modifiers that force text selection even when the client application has
# grabbed the mouse.
#
# These modifiers cannot be reused by mouse bindings.
# This option should appear before other modifier-based mouse bindings.
#
# Default: Shift
# selection-override-modifiers=Shift

# Scroll upward with the mouse wheel.
#
# On the normal screen, scrolls terminal scrollback.
# On the alternate screen, sends synthetic Up key events when alternate scroll
# mode is enabled.
#
# Default: BTN_WHEEL_BACK
# scrollback-up-mouse=BTN_WHEEL_BACK

# Scroll downward with the mouse wheel.
#
# On the normal screen, scrolls terminal scrollback.
# On the alternate screen, sends synthetic Down key events when alternate
# scroll mode is enabled.
#
# Default: BTN_WHEEL_FORWARD
# scrollback-down-mouse=BTN_WHEEL_FORWARD

# ==============================================================================
# TEXT BINDINGS
# ==============================================================================
#
# Remap key combinations to arbitrary characters or byte sequences.
#
# Format:
# text=combo1 combo2 ... comboN
#
# Key combinations use XKB modifier and key names:
# mod1+mod2+key
#
# Printable characters can be written directly.
# Non-printable bytes are written as two-digit hexadecimal values with a
# \x prefix.
#
# This section has no default bindings.

[text-bindings]

# Example:
# Map Super+k to the escape sequence generated by the Up arrow key.
#
# ESC [ A
#
# \x1b[A=Mod4+k

# Example:
# Map Super+c to Control+c.
#
# Control+c emits byte 0x03.
#
# \x03=Mod4+c

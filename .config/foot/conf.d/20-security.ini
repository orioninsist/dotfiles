# ==============================================================================
# SECURITY
# ==============================================================================

[security]

# Controls OSC-52 access to the host Wayland clipboard.
#
# Values:
# disabled      = applications cannot read or write the clipboard
# copy-enabled  = applications may write to the clipboard, but not read it
# paste-enabled = applications may read the clipboard, but not write to it
# enabled       = full clipboard read and write access
#
# Consider restricting this when using untrusted remote SSH sessions or
# containers, since terminal applications may otherwise access the host
# clipboard.
#
# Default: enabled
# osc52=enabled

# ==============================================================================
# BELL
# ==============================================================================

[bell]

# Ring the system/compositor bell when BEL is received.
# This happens regardless of whether the Foot window has keyboard focus.
# Exact behavior depends on the compositor.
# Default: yes
# system=yes

# Signal urgency to the compositor when BEL is received while the Foot window
# does not have keyboard focus.
# Uses the XDG activation protocol when supported.
# Default: no
# urgent=no

# Emit a desktop notification when BEL is received.
# Notification behavior is also affected by:
# desktop-notifications.inhibit-when-focused
# Default: no
# notify=no

# Flash the terminal window when BEL is received.
# Default: no
# visual=no

# Execute a custom command when BEL is received.
# Default: not set
# command=

# Allow the custom BEL command to run even while the Foot window is focused.
# Default: no
# command-focused=no

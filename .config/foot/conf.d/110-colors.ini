# ==============================================================================
# COLORS-DARK / COLORS-LIGHT
# ==============================================================================
#
# The active main configuration already defines a custom [colors-dark] palette.
# Existing foreground, background, regular0..7, bright0..7 and alpha values are
# intentionally not duplicated here.
#
# Foot supports two independent theme sections:
#
# [colors-dark]
# [colors-light]
#
# Theme switching can be controlled with the corresponding color-theme key
# bindings and initial-color-theme.

# ------------------------------------------------------------------------------
# Core colors
# ------------------------------------------------------------------------------

# Cursor foreground/background colors.
# Uses two colors when explicitly configured.
# Default: current foreground and background colors, inversed.
# cursor=

# Default terminal foreground color.
# Built-in default: 839496
# foreground=839496

# Default terminal background color.
# Built-in default: 002b36
# background=002b36

# ANSI regular palette colors.
# Defines colors 0 through 7.
# regular0=
# regular1=
# regular2=
# regular3=
# regular4=
# regular5=
# regular6=
# regular7=

# ANSI bright palette colors.
# Defines colors 8 through 15.
# bright0=
# bright1=
# bright2=
# bright3=
# bright4=
# bright5=
# bright6=
# bright7=

# Optional dim variants of ANSI colors.
# Default: not set
# dim0=
# dim1=
# dim2=
# dim3=
# dim4=
# dim5=
# dim6=
# dim7=

# Arbitrary entries in the complete 256-color terminal palette.
# Valid indexes: 0 through 255.
#
# Example:
# 16=112233

# Sixel graphics palette colors.
# Valid indexes: sixel0 through sixel15.
#
# sixel0=
# sixel1=
# ...
# sixel15=

# ------------------------------------------------------------------------------
# Transparency and blur
# ------------------------------------------------------------------------------

# Terminal background opacity.
#
# 0.0 = fully transparent
# 1.0 = fully opaque
#
# The active main configuration already defines alpha=0.96.
# Default: 1.0
# alpha=1.0

# Controls how alpha transparency is applied.
# Default: default
# alpha-mode=default

# Enable compositor background blur support.
# Availability and exact appearance depend on the compositor.
# Default: no
# blur=no

# ------------------------------------------------------------------------------
# Dim colors
# ------------------------------------------------------------------------------

# Target color used when Foot synthesizes dim colors.
#
# Defaults:
# colors-dark  = black
# colors-light = white
#
# dim-blend-towards=black

# ------------------------------------------------------------------------------
# Selection
# ------------------------------------------------------------------------------

# Foreground and background colors used for selected text.
# Default: inverse foreground/background
# selection-foreground=
# selection-background=

# ------------------------------------------------------------------------------
# URL and navigation UI
# ------------------------------------------------------------------------------

# Foreground/background colors used for URL jump labels.
# Default: Foot built-in palette-derived colors.
# jump-labels=

# Colors used by the scrollback position indicator.
# Default: Foot built-in palette-derived colors.
# scrollback-indicator=

# Colors used by the search box when there is no match.
# Default: regular0 regular1
# search-box-no-match=regular0 regular1

# Colors used by the search box when there are matches.
# Default: regular0 regular3
# search-box-match=regular0 regular3

# Color used for URLs in URL mode.
# Default: regular3
# urls=regular3

# ------------------------------------------------------------------------------
# Visual bell
# ------------------------------------------------------------------------------

# Color used when flashing the terminal window.
# Default: 7f7f00
# flash=7f7f00

# Opacity of the terminal flash.
#
# 0.0 = fully transparent
# 1.0 = fully opaque
#
# Default: 0.5
# flash-alpha=0.5

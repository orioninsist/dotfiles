# ==============================================================================
# URL
# ==============================================================================

[url]

# Command executed when opening a URL.
#
# ${url} is replaced with the actual URL.
#
# Default: xdg-open ${url}
# launch=xdg-open ${url}

# Controls when OSC-8 hyperlinks are underlined.
#
# Values:
# url-mode = underline only while URL mode is active
# always   = always underline OSC-8 URLs
#
# Note: "always" only changes highlighting; it does not make URLs clickable.
#
# Default: url-mode
# osc8-underline=url-mode

# Underline style used for URLs.
#
# Applies to:
# - OSC-8 URLs when osc8-underline=always
# - auto-detected URLs while URL mode is active
#
# Values:
# none
# single
# double
# curly
# dotted
# dashed
#
# Default: dotted
# style=dotted

# Characters used to generate URL jump labels.
#
# If the letter "t" is added, the default
# [url-bindings].toggle-url-visible binding should also be changed to avoid
# a key conflict.
#
# Default: sadfjklewcmpgh
# label-letters=sadfjklewcmpgh

# POSIX Extended Regular Expression used for automatic URL detection.
#
# The first marked subexpression is treated as the URL.
# To use the entire match as the URL, wrap the full expression in parentheses.
#
# Default: Foot's built-in URL detection regular expression.
# regex=

# ==============================================================================
# SEARCH BINDINGS
# ==============================================================================

[search-bindings]

# Cancel search mode without updating the primary selection.
# cancel=

# Commit the current search selection.
# commit=

# Find the previous match.
# Default: Control+r
# find-prev=Control+r

# Find the next match.
# Default: Control+s
# find-next=Control+s

# Move the search input cursor one character left.
# Default includes Left and Control+b.
# cursor-left=

# Move the search input cursor one word left.
# Default includes Control+Left and Mod1+b.
# cursor-left-word=

# Move the search input cursor one character right.
# Default includes Right and Control+f.
# cursor-right=

# Move the search input cursor one word right.
# Default includes Control+Right and Mod1+f.
# cursor-right-word=

# Move to the beginning of the search input.
# Default includes Home and Control+a.
# cursor-home=

# Move to the end of the search input.
# Default includes End and Control+e.
# cursor-end=

# Delete the character before the cursor.
# Default: BackSpace
# delete-prev=BackSpace

# Delete the word before the cursor.
# delete-prev-word=

# Delete the character after the cursor.
# Default: Delete
# delete-next=Delete

# Delete the word after the cursor.
# delete-next-word=

# Delete everything before the cursor.
# Default: Ctrl+u
# delete-to-start=Ctrl+u

# Delete everything after the cursor.
# Default: Ctrl+k
# delete-to-end=Ctrl+k

# Extend the current selection one character to the right.
# extend-char=

# Extend the selection to the next word boundary.
# Default includes Control+w and Control+Shift+Right.
# extend-to-word-boundary=

# Extend the selection to the next whitespace boundary.
# Default: Control+Shift+w
# extend-to-next-whitespace=Control+Shift+w

# Extend the selection one line downward.
# Default: Shift+Down
# extend-line-down=Shift+Down

# Extend the current selection one character to the left.
# extend-backward-char=

# Extend the selection backward to the previous word boundary.
# Default: Control+Shift+Left
# extend-backward-to-word-boundary=Control+Shift+Left

# Extend the selection backward to the next whitespace boundary.
# Default: none
# extend-backward-to-next-whitespace=

# Extend the selection one line upward.
# Default: Shift+Up
# extend-line-up=Shift+Up

# Paste clipboard contents into the search input.
# clipboard-paste=

# Paste primary-selection contents into the search input.
# Default: Shift+Insert
# primary-paste=Shift+Insert

# Start Unicode input while search mode is active.
# Default: none
# unicode-input=

# Scroll one page upward in scrollback.
# scrollback-up-page=

# Scroll half a page upward.
# Default: none
# scrollback-up-half-page=

# Scroll one line upward.
# Default: none
# scrollback-up-line=

# Scroll one page downward.
# scrollback-down-page=

# Scroll half a page downward.
# Default: none
# scrollback-down-half-page=

# Scroll one line downward.
# Default: none
# scrollback-down-line=

# Jump to the beginning of scrollback.
# Default: none
# scrollback-home=

# Jump to the end of scrollback.
# Default: none
# scrollback-end=

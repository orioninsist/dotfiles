# ==============================================================================
# CLIENT SIDE DECORATIONS
# ==============================================================================

[csd]

# Preferred decoration mode.
#
# Values:
# client = prefer client-side decorations (CSD)
# server = prefer compositor/server-side decorations (SSD)
# none   = prefer no decorations
#
# This is only a compositor hint and may be overridden by compositor support
# or configuration.
#
# Default: server
# preferred=server

# CSD titlebar height in pixels.
# Setting this to 0 hides the titlebar while still allowing a border.
#
# Default: 26
# size=26

# Titlebar color.
#
# CSD colors use AARRGGBB format:
# AA = alpha
# RR = red
# GG = green
# BB = blue
#
# Default: terminal foreground color
# color=

# Font used for the titlebar.
# Font size attributes are ignored because the titlebar size controls sizing.
#
# Default: primary terminal font
# font=

# Hide the CSD titlebar while the window is maximized.
#
# Default: no
# hide-when-maximized=no

# Allow double-clicking the titlebar to maximize or unmaximize the window.
#
# Default: yes
# double-click-to-maximize=yes

# Border width in pixels.
# The border surrounds the complete window, including the titlebar.
#
# Default: 0
# border-width=0

# Border color.
#
# Default: titlebar color, or terminal foreground if no titlebar color is set.
# border-color=

# Width of minimize, maximize and close buttons in pixels.
#
# Default: 26
# button-width=26

# Foreground color used for titlebar text and window-control buttons.
#
# Default: terminal background color
# button-color=

# Background color of the minimize button.
#
# Default: regular4
# button-minimize-color=

# Background color of the maximize button.
#
# Default: regular2
# button-maximize-color=

# Background color of the close button.
#
# Default: regular1
# button-close-color=

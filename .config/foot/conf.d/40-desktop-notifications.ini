# ==============================================================================
# DESKTOP NOTIFICATIONS
# ==============================================================================

[desktop-notifications]

# Command used to display desktop notifications.
#
# The default command uses notify-send and supports notification metadata,
# replacement IDs, actions, icons, urgency, expiration time and sound hints.
#
# Template variables available to the command include notification properties
# such as title, body, application ID, window title, icon, category, urgency,
# expiration time, replacement ID and action arguments.
#
# Default: notify-send with Foot's standard notification arguments.
# command=

# Argument template used to pass notification actions to the notification
# helper.
#
# ${action-name} is replaced with the action identifier.
# ${action-label} is replaced with the human-readable action label.
#
# Setting this to an empty string disables passing actions to the notification
# helper.
#
# Default: --action ${action-name}=${action-label}
# command-action-argument=--action ${action-name}=${action-label}

# Command used to close an existing notification.
#
# ${id} is replaced with the notification ID.
# When unset, Foot attempts to close the notification by sending SIGINT to the
# notification helper process.
#
# Default: not set
# close=

# Prevent desktop notifications from being displayed while the Foot window has
# keyboard focus.
#
# Default: yes
# inhibit-when-focused=yes

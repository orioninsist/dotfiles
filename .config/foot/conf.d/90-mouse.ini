# ==============================================================================
# MOUSE
# ==============================================================================
#
# The active main configuration already defines:
# hide-when-typing=yes
#
# It is intentionally not duplicated here.

[mouse]

# Controls alternate-screen mouse scrolling.
#
# When enabled, mouse wheel events are translated into Up/Down key events
# while an application is using the alternate screen.
#
# This allows mouse scrolling in applications such as less even when they do
# not have native mouse support enabled.
#
# This behavior is not used when the application enables native mouse support.
#
# Applications may change this setting at runtime using:
# CSI ? 1007 h = enable
# CSI ? 1007 l = disable
#
# Default: yes
# alternate-scroll-mode=yes

# ==============================================================================
# URL BINDINGS
# ==============================================================================
#
# Key bindings used while Foot is in URL mode.
#
# Avoid single-letter bindings that are also present in [url].label-letters,
# since doing so can make some URL jump labels inaccessible.

[url-bindings]

# Exit URL mode without opening a URL.
#
# Default: Control+g Control+c Control+d Escape
# cancel=Control+g Control+c Control+d Escape

# Toggle whether the actual URL is displayed together with its jump label.
#
# This is especially useful for OSC-8 hyperlinks, where the visible terminal
# text may be completely different from the underlying URL.
#
# Default: t
# toggle-url-visible=t

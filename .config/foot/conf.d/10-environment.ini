# ==============================================================================
# ENVIRONMENT
# ==============================================================================
#
# Additional environment variables exported to applications started inside
# Foot. Variables already inherited by Foot are propagated automatically.
#
# Format:
# NAME=value
#
# TERM must not be configured here. Use the main "term" option instead.
#
# No additional environment variables are currently required.
#
# Example:
# EXAMPLE_VARIABLE=value

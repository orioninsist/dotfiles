# ==============================================================================
# CURSOR
# ==============================================================================
#
# The active main configuration already defines:
# style=block
# blink=yes
#
# They are intentionally not duplicated here.

[cursor]

# Controls cursor appearance when the terminal window is unfocused.
#
# Values:
# unchanged = render exactly as when focused
# hollow    = render a hollow block cursor
# none      = hide the cursor completely
#
# Default: see Foot's built-in behavior
# unfocused-style=unchanged

# Cursor blink interval in milliseconds.
# Used when cursor blinking is enabled.
#
# Default: 500
# blink-rate=500

# Width of the beam cursor.
#
# The value is specified in points by default and therefore depends on DPI.
# Add the "px" suffix to specify an exact pixel width.
#
# Example: beam-thickness=2px
#
# Default: 1.5
# beam-thickness=1.5

# Height of the underline cursor.
#
# The value is specified in points by default.
# Add the "px" suffix to specify an exact pixel height.
#
# When unset, the thickness scales with the font size.
#
# Default: font underline thickness
# underline-thickness=

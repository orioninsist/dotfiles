# ==============================================================================
# KEY BINDINGS
# ==============================================================================
#
# The active main configuration already defines:
# clipboard-copy=Control+Shift+c
# clipboard-paste=Control+Shift+v
# font-increase=Control+plus Control+equal
# font-decrease=Control+minus
# font-reset=Control+0
# spawn-terminal=Control+Shift+n
#
# They are intentionally not duplicated here.

[key-bindings]

# Disable a key combination by binding it to no operation.
# noop=

# Scrollback navigation.
# scrollback-up-page=
# scrollback-up-half-page=
# scrollback-up-line=
# scrollback-down-page=
# scrollback-down-half-page=
# scrollback-down-line=
# scrollback-home=
# scrollback-end=

# Paste from the primary selection.
# Default: Shift+Insert
# primary-paste=Shift+Insert

# Start scrollback/history search.
# Default: Control+Shift+r
# search-start=Control+Shift+r

# Minimize the Foot window.
# Default: none
# minimize=

# Toggle maximized state.
# Default: none
# maximize=

# Toggle fullscreen state.
# Default: none
# fullscreen=

# Pipe currently visible terminal contents to a command.
# Default: none
# pipe-visible=

# Copy the complete Foot scrollback when Zellij is not owning the terminal.
pipe-scrollback=[/home/murat/.local/bin/wl-copy] Control+Shift+y

# Pipe currently selected text to a command.
# Default: none
# pipe-selected=

# Pipe command output to an external command.
# Default: none
# pipe-command-output=

# Enter URL mode and launch the selected URL.
# Default: Control+Shift+o
# show-urls-launch=Control+Shift+o

# Enter persistent URL mode.
# URL mode remains active after activating a URL.
# Default: none
# show-urls-persistent=

# Enter URL mode and copy the selected URL instead of launching it.
# Default: none
# show-urls-copy=

# Launch a match from a named [regex:name] section.
#
# Syntax includes the regex name before the key combination.
# Default: none
# regex-launch=

# Copy a match from a named [regex:name] section.
# Default: none
# regex-copy=

# Jump to the previous shell prompt when shell integration is available.
# Default: Control+Shift+z
# prompt-prev=Control+Shift+z

# Jump to the next shell prompt when shell integration is available.
# Default: Control+Shift+x
# prompt-next=Control+Shift+x

# Start Unicode codepoint input.
# Default: Control+Shift+u
# unicode-input=Control+Shift+u

# Switch explicitly to the dark color theme.
# Default: none
# color-theme-switch-dark=

# Switch explicitly to the light color theme.
# Default: none
# color-theme-switch-light=

# Toggle between dark and light color themes.
# Default: none
# color-theme-toggle=

# Quit Foot.
# Default: none
# quit=

# Modular Foot configuration
include=~/.config/foot/conf.d/10-environment.ini
include=~/.config/foot/conf.d/20-security.ini
include=~/.config/foot/conf.d/30-bell.ini
include=~/.config/foot/conf.d/40-desktop-notifications.ini
include=~/.config/foot/conf.d/50-scrollback.ini
include=~/.config/foot/conf.d/60-url.ini
include=~/.config/foot/conf.d/70-regex.ini
include=~/.config/foot/conf.d/80-cursor.ini
include=~/.config/foot/conf.d/90-mouse.ini
include=~/.config/foot/conf.d/100-touch.ini
include=~/.config/foot/conf.d/110-colors.ini
include=~/.config/foot/conf.d/120-csd.ini
include=~/.config/foot/conf.d/130-key-bindings.ini
include=~/.config/foot/conf.d/140-search-bindings.ini
include=~/.config/foot/conf.d/150-url-bindings.ini
include=~/.config/foot/conf.d/160-text-bindings.ini
include=~/.config/foot/conf.d/170-mouse-bindings.ini

shell=/bin/bash
login-shell=no
term=foot

font=Google Sans Code:size=12
font-bold=Google Sans Code:style=Bold:size=12
font-italic=Google Sans Code:style=Italic:size=12
font-bold-italic=Google Sans Code:style=Bold Italic:size=12
font-size-adjustment=0.5
letter-spacing=0
gamma-correct-blending=yes

dpi-aware=no
pad=12x10
selection-target=primary

[cursor]
style=beam
blink=no
beam-thickness=2px
unfocused-style=hollow

[scrollback]
lines=20000
multiplier=3.0

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=1.0
background=1e1e2e
foreground=cdd6f4
regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=cba6f7
regular6=94e2d5
regular7=bac2de
bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=cba6f7
bright6=94e2d5
bright7=a6adc8

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
spawn-terminal=Control+Shift+n

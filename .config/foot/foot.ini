include=/home/murat/.config/foot/conf.d/20-security.ini
include=/home/murat/.config/foot/conf.d/30-bell.ini
include=/home/murat/.config/foot/conf.d/40-desktop-notifications.ini
include=/home/murat/.config/foot/conf.d/50-scrollback.ini
include=/home/murat/.config/foot/conf.d/60-url.ini
include=/home/murat/.config/foot/conf.d/70-regex.ini
include=/home/murat/.config/foot/conf.d/80-cursor.ini
include=/home/murat/.config/foot/conf.d/90-mouse.ini
include=/home/murat/.config/foot/conf.d/100-touch.ini
include=/home/murat/.config/foot/conf.d/110-colors.ini
include=/home/murat/.config/foot/conf.d/120-csd.ini
include=/home/murat/.config/foot/conf.d/130-key-bindings.ini
include=/home/murat/.config/foot/conf.d/140-search-bindings.ini
include=/home/murat/.config/foot/conf.d/150-url-bindings.ini
include=/home/murat/.config/foot/conf.d/160-text-bindings.ini
include=/home/murat/.config/foot/conf.d/170-mouse-bindings.ini

# ==============================================================================
# FOOT TERMINAL CONFIGURATION
# Tuned for long coding and terminal sessions
# ==============================================================================

shell=/bin/bash
login-shell=no
term=foot

# ------------------------------------------------------------------------------
# Typography
# ------------------------------------------------------------------------------

# Google Sans Code stays as the primary coding font. Slightly larger sizing
# reduces visual crowding during long sessions.
font=Google Sans Code:size=12
font-bold=Google Sans Code:style=Bold:size=12
font-italic=Google Sans Code:style=Italic:size=12
font-bold-italic=Google Sans Code:style=Bold Italic:size=12
font-size-adjustment=0.5
letter-spacing=0

# Gamma-correct glyph blending improves perceived text rendering on supported
# displays/compositors without changing the font family.
gamma-correct-blending=yes

# ------------------------------------------------------------------------------
# DPI and spacing
# ------------------------------------------------------------------------------

dpi-aware=no
pad=12x10

# ------------------------------------------------------------------------------
# Selection
# ------------------------------------------------------------------------------

selection-target=primary

# ==============================================================================
# CURSOR
# ==============================================================================

[cursor]
style=beam
blink=no
beam-thickness=2px
unfocused-style=hollow

# ==============================================================================
# SCROLLBACK
# ==============================================================================

[scrollback]
lines=20000
multiplier=3.0

# ==============================================================================
# MOUSE
# ==============================================================================

[mouse]
hide-when-typing=yes

# ==============================================================================
# DARK COLOR PALETTE
# Low-glare, high-legibility dark palette for extended reading
# ==============================================================================

[colors-dark]
alpha=1.0
background=1e1e2e
foreground=cdd6f4

regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=cba6f7
regular6=94e2d5
regular7=bac2de

bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=cba6f7
bright6=94e2d5
bright7=a6adc8

# ==============================================================================
# KEY BINDINGS
# ==============================================================================

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
spawn-terminal=Control+Shift+n

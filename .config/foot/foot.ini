# ==============================================================================
# FOOT TERMINAL CONFIGURATION
# Foot version: 1.28.x
# ==============================================================================
#
# MAIN
#
# Options in this section control the terminal process, fonts, rendering,
# sizing, window identity, selection behavior and worker threads.
# ==============================================================================

# Executable started inside the terminal.
# Default: $SHELL, or /bin/sh if $SHELL is not set.
shell=/bin/bash

# Start the configured shell as a login shell.
# Default: no
login-shell=no

# Value exported as the TERM environment variable.
# Foot applications normally expect TERM=foot.
# Default: foot
term=foot

# ------------------------------------------------------------------------------
# Fonts
# ------------------------------------------------------------------------------

# Primary terminal font.
# Default: monospace:size=8
font=Google Sans Code:size=11.5

# Font used for bold text.
# Default: not explicitly set; derived from the primary font.
font-bold=Google Sans Code:style=Bold:size=11.5

# Font used for italic text.
# Default: not explicitly set; derived from the primary font.
font-italic=Google Sans Code:style=Italic:size=11.5

# Font used for bold italic text.
# Default: not explicitly set; derived from the primary font.
font-bold-italic=Google Sans Code:style=Bold Italic:size=11.5

# Amount used when increasing or decreasing the font size.
# Default: 0.5
# font-size-adjustment=0.5

# Include another Foot configuration file.
# May be specified multiple times.
# Default: not set
# include=/path/to/another-foot.ini

# Override the terminal line height.
# Accepts an absolute pixel value or a percentage.
# Default: not set
# line-height=

# Additional horizontal spacing between characters.
# Default: 0
# letter-spacing=0

# Move rendered glyphs horizontally relative to their cells.
# Default: 0
# horizontal-letter-offset=0

# Move rendered glyphs vertically relative to their cells.
# Default: 0
# vertical-letter-offset=0

# Override the vertical position of text underlines.
# Default: unset; calculated from the font.
# underline-offset=

# Override underline thickness.
# Default: unset; calculated from the font.
# underline-thickness=

# Override strikeout thickness.
# Default: unset; calculated from the font.
# strikeout-thickness=

# Use gamma-correct alpha blending when rendering glyphs.
# This may change perceived text weight and appearance.
# Default: no
# gamma-correct-blending=no

# Automatically uppercase inserted regular expressions where appropriate.
# Default: yes
# uppercase-regex-insert=yes

# Use glyphs supplied by the font for Unicode box drawing characters instead
# of Foot's built-in box drawing renderer.
# Default: no
# box-drawings-uses-font-glyphs=no

# ------------------------------------------------------------------------------
# DPI and padding
# ------------------------------------------------------------------------------

# Control whether font sizes are adjusted according to output DPI.
# "no" gives consistent logical sizing under Wayland scaling.
# Default: no
dpi-aware=no

# Horizontal and vertical padding around the terminal grid.
# Current value: 8 pixels horizontally and vertically.
# Default: 0x0
pad=8x8

# ------------------------------------------------------------------------------
# Window resizing
# ------------------------------------------------------------------------------

# Delay, in milliseconds, before applying certain interactive resizes.
# Default: 100
# resize-delay-ms=100

# Resize the terminal window in whole character-cell increments.
# Default: yes
# resize-by-cells=yes

# Try to preserve the terminal grid while resizing.
# Default: yes
# resize-keep-grid=yes

# ------------------------------------------------------------------------------
# Initial window state
# ------------------------------------------------------------------------------

# Initial color theme used when both colors-dark and colors-light exist.
# Valid values include dark and light.
# Default: dark
# initial-color-theme=dark

# Initial window size in pixels.
# Ignored when initial-window-size-chars is configured.
# Default: 700x500
# initial-window-size-pixels=700x500

# Initial terminal size expressed as columns and rows.
# When set, this takes precedence over the pixel-based initial size.
# Default: not set
# initial-window-size-chars=80x24

# Initial window state.
# Supported modes include windowed, maximized and fullscreen.
# Default: windowed
# initial-window-mode=windowed

# ------------------------------------------------------------------------------
# Window identity
# ------------------------------------------------------------------------------

# Initial window title.
# Applications may change it later unless locked-title is enabled.
# Default: foot
# title=foot

# Prevent terminal applications from changing the window title.
# Default: no
# locked-title=no

# Wayland application ID.
# Sway can use this value in for_window rules.
# Default: foot for the normal Foot client.
# app-id=foot

# Optional Wayland toplevel tag.
# Can be used by supporting compositors for window identification and rules.
# Default: not set
# toplevel-tag=

# ------------------------------------------------------------------------------
# Text and selection behavior
# ------------------------------------------------------------------------------

# Render ANSI bold text using the corresponding bright palette color when
# the foreground matches one of the eight regular palette colors.
# Default: no
# bold-text-in-bright=no

# Characters treated as word separators during word selection.
# Whitespace is always treated as a delimiter independently of this option.
# Default: ,│`|:"'()[]{}<>
# word-delimiters=,│`|:"'()[]{}<>

# Automatically copy newly selected text to a clipboard target.
# Values: none, primary, clipboard, both
# Default: primary
# selection-target=primary

# ------------------------------------------------------------------------------
# Rendering workers
# ------------------------------------------------------------------------------

# Number of worker threads used for rendering.
# 0 disables multithreaded rendering.
# Default: number of available logical CPUs.
# workers=0

# ------------------------------------------------------------------------------
# UTMP
# ------------------------------------------------------------------------------

# Helper used to create and remove utmp login records.
# This build detected /usr/lib/utempter/utempter.
# Set to "none" to disable utmp records.
# Default for this build: /usr/lib/utempter/utempter
# utmp-helper=/usr/lib/utempter/utempter

# ==============================================================================
# CURSOR
# ==============================================================================

[cursor]
style=block
blink=yes

# ==============================================================================
# SCROLLBACK
# ==============================================================================

[scrollback]
lines=10000
multiplier=3.0

# ==============================================================================
# MOUSE
# ==============================================================================

[mouse]
hide-when-typing=yes

# ==============================================================================
# DARK COLOR PALETTE
# ==============================================================================

[colors-dark]
alpha=0.96
background=24273a
foreground=cad3f5

regular0=494d64
regular1=ed8796
regular2=a6da95
regular3=eed49f
regular4=8aadf4
regular5=f5bde6
regular6=8bd5ca
regular7=b8c0e0

bright0=5b6078
bright1=ed8796
bright2=a6da95
bright3=eed49f
bright4=8aadf4
bright5=f5bde6
bright6=8bd5ca
bright7=a5adcb

# ==============================================================================
# KEY BINDINGS
# ==============================================================================

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
spawn-terminal=Control+Shift+n

# Session environment and session actions

# Keep systemd-user and D-Bus synchronized with the current Sway session
exec_always systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE SWAYSOCK I3SOCK XCURSOR_SIZE XCURSOR_THEME QT_QPA_PLATFORM
exec_always dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE SWAYSOCK I3SOCK XCURSOR_SIZE XCURSOR_THEME QT_QPA_PLATFORM

# Desktop preferences
exec_always gsettings set org.gnome.desktop.interface monospace-font-name 'Google Sans Code 10'

# User session services
exec systemctl --user start sway-session.target
exec systemctl --user start cliphist.service

# Notification daemon
exec /usr/local/bin/mako

# Suspend and lock
bindsym $mod+Shift+s exec sh -c '/usr/local/bin/swaylock -f -c 000000 && systemctl suspend'

# Exit Sway
bindsym $mod+Shift+Escape exec /usr/local/bin/swaynag -t warning -m "You pressed the exit shortcut. Do you really want to exit sway? This will end your Wayland session." -B "Yes, exit sway" "/usr/local/bin/swaymsg exit"

# Night light
bindsym $mod+Shift+n exec ~/.config/sway/scripts/wlsunset-toggle

# Notifications
bindsym $mod+n exec ~/.config/sway/scripts/mako-toggle

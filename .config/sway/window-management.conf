# Sway native window management
# Contains only compositor-level window and container management.

### Focus movement
bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right

bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# Workspace cyclic focus
bindsym $mod+Ctrl+Tab exec ~/.config/sway/scripts/workspace-cycle-focus next
bindsym $mod+Ctrl+Shift+Tab exec ~/.config/sway/scripts/workspace-cycle-focus prev

### Container movement
bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right

bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

### Layout
bindsym $mod+b splith
bindsym $mod+v splitv
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split
# Native tree split controls: toggle the pending split relative to the parent,
# or cycle every container layout without patching Sway.
bindsym $mod+Ctrl+e split toggle
bindsym $mod+Ctrl+Shift+e layout toggle all

### Fullscreen
bindsym $mod+f fullscreen

### Floating
floating_modifier $mod normal
bindsym $mod+Shift+space floating toggle
bindsym $mod+space focus mode_toggle

### Container hierarchy
bindsym $mod+a focus parent
bindsym $mod+Ctrl+j focus child

### Scratchpad
bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus scratchpad show

# Scratchpad - numeric keypad
bindsym $mod+Shift+KP_Subtract move scratchpad
bindsym $mod+KP_Subtract scratchpad show

### Resize mode
mode "resize" {
    bindsym $left resize shrink width 10px
    bindsym $down resize grow height 10px
    bindsym $up resize shrink height 10px
    bindsym $right resize grow width 10px

    bindsym Left resize shrink width 10px
    bindsym Down resize grow height 10px
    bindsym Up resize shrink height 10px
    bindsym Right resize grow width 10px

    bindsym Return mode "default"
    bindsym Escape mode "default"
}

bindsym $mod+r mode "resize"

### Workspace output movement
bindsym $mod+Ctrl+Right move workspace to output right
bindsym $mod+Ctrl+Left move workspace to output left

### Floating window positioning
bindsym $mod+Ctrl+c move position center
bindsym $mod+Ctrl+Up move up 20 px
bindsym $mod+Ctrl+Down move down 20 px
bindsym $mod+Ctrl+Shift+Left move left 20 px
bindsym $mod+Ctrl+Shift+Right move right 20 px

### Container border
bindsym $mod+Ctrl+b border toggle

### Quick mark
bindsym $mod+Ctrl+F7 mark --toggle quick
bindsym $mod+Ctrl+F8 [con_mark="quick"] focus
# Mark one container with F7, focus another container, then swap the two.
bindsym $mod+Ctrl+F9 swap container with mark quick

### Output focus
bindsym $mod+Ctrl+Shift+h focus output left
bindsym $mod+Ctrl+Shift+j focus output down
bindsym $mod+Ctrl+Shift+k focus output up
bindsym $mod+Ctrl+Shift+l focus output right

### Container output movement
bindsym $mod+Alt+h move container to output left
bindsym $mod+Alt+j move container to output down
bindsym $mod+Alt+k move container to output up
bindsym $mod+Alt+l move container to output right

### Window marks
set $mark_mode "Mark window [1-9]"
mode $mark_mode {
    bindsym 1 mark --replace mark1; mode "default"
    bindsym 2 mark --replace mark2; mode "default"
    bindsym 3 mark --replace mark3; mode "default"
    bindsym 4 mark --replace mark4; mode "default"
    bindsym 5 mark --replace mark5; mode "default"
    bindsym 6 mark --replace mark6; mode "default"
    bindsym 7 mark --replace mark7; mode "default"
    bindsym 8 mark --replace mark8; mode "default"
    bindsym 9 mark --replace mark9; mode "default"
    bindsym Escape mode "default"
}

bindsym $mod+Ctrl+Shift+F7 mode $mark_mode

### Focus marked windows
set $mark_focus_mode "Focus mark [1-9]"
mode $mark_focus_mode {
    bindsym 1 [con_mark="mark1"] focus; mode "default"
    bindsym 2 [con_mark="mark2"] focus; mode "default"
    bindsym 3 [con_mark="mark3"] focus; mode "default"
    bindsym 4 [con_mark="mark4"] focus; mode "default"
    bindsym 5 [con_mark="mark5"] focus; mode "default"
    bindsym 6 [con_mark="mark6"] focus; mode "default"
    bindsym 7 [con_mark="mark7"] focus; mode "default"
    bindsym 8 [con_mark="mark8"] focus; mode "default"
    bindsym 9 [con_mark="mark9"] focus; mode "default"
    bindsym Escape mode "default"
}

bindsym $mod+Ctrl+Shift+F8 mode $mark_focus_mode

### Window borders
default_border pixel 3
default_floating_border pixel 3


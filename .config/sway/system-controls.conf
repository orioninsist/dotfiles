# System controls
# Audio, media, brightness, power and hardware toggles.

### Audio
bindsym --locked XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+

### Media
bindsym --locked XF86AudioPlay exec playerctl play-pause
bindsym --locked XF86AudioPause exec playerctl play-pause
bindsym --locked XF86AudioPrev exec playerctl previous
bindsym --locked XF86AudioNext exec playerctl next
bindsym --locked XF86AudioStop exec playerctl stop

### Brightness
bindsym --locked XF86MonBrightnessDown exec brightnessctl set 5%-
bindsym --locked XF86MonBrightnessUp exec brightnessctl set 5%+

### Power profiles
bindsym $mod+F1 exec busctl set-property net.hadess.PowerProfiles /net/hadess/PowerProfiles net.hadess.PowerProfiles ActiveProfile s performance && notify-send "Power Profile" "Performance mode enabled"
bindsym $mod+F2 exec busctl set-property net.hadess.PowerProfiles /net/hadess/PowerProfiles net.hadess.PowerProfiles ActiveProfile s balanced && notify-send "Power Profile" "Balanced mode enabled"
bindsym $mod+F3 exec busctl set-property net.hadess.PowerProfiles /net/hadess/PowerProfiles net.hadess.PowerProfiles ActiveProfile s power-saver && notify-send "Power Profile" "Battery saving mode enabled"

### Bluetooth
bindsym $mod+t exec ~/.config/sway/scripts/bluetooth/bluetooth-toggle

### Audio output
bindsym $mod+F4 exec ~/.config/sway/scripts/audio/audio-toggle

### Microphone
bindsym $mod+F5 exec ~/.config/sway/scripts/input/mic-toggle

### Camera
bindsym $mod+F6 exec ~/.config/sway/scripts/input/camera-toggle

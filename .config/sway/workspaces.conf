# ASUS workspaces
workspace "201:1: 🌐" output HDMI-A-1
workspace "202:2: ⌨" output HDMI-A-1
workspace "203:3: ⌘" output HDMI-A-1
workspace "204:4: ◈" output HDMI-A-1
workspace "205:5: ♪" output HDMI-A-1
workspace "206:6: ●" output HDMI-A-1
workspace "207:7: ♪" output HDMI-A-1
workspace "208:8: ✉" output HDMI-A-1
workspace "209:9: 🔒" output HDMI-A-1
workspace "210:10: ⚙" output HDMI-A-1

# Switch workspace on the pointer-focused output
bindsym Mod4+1 exec ~/.config/sway/scripts/workspace-local switch 1
bindsym Mod4+2 exec ~/.config/sway/scripts/workspace-local switch 2
bindsym Mod4+3 exec ~/.config/sway/scripts/workspace-local switch 3
bindsym Mod4+4 exec ~/.config/sway/scripts/workspace-local switch 4
bindsym Mod4+5 exec ~/.config/sway/scripts/workspace-local switch 5
bindsym Mod4+6 exec ~/.config/sway/scripts/workspace-local switch 6
bindsym Mod4+7 exec ~/.config/sway/scripts/workspace-local switch 7
bindsym Mod4+8 exec ~/.config/sway/scripts/workspace-local switch 8
bindsym Mod4+9 exec ~/.config/sway/scripts/workspace-local switch 9
bindsym Mod4+0 exec ~/.config/sway/scripts/workspace-local switch 10

# Move focused container to the local workspace
bindsym Mod4+Shift+1 exec ~/.config/sway/scripts/workspace-local move 1
bindsym Mod4+Shift+2 exec ~/.config/sway/scripts/workspace-local move 2
bindsym Mod4+Shift+3 exec ~/.config/sway/scripts/workspace-local move 3
bindsym Mod4+Shift+4 exec ~/.config/sway/scripts/workspace-local move 4
bindsym Mod4+Shift+5 exec ~/.config/sway/scripts/workspace-local move 5
bindsym Mod4+Shift+6 exec ~/.config/sway/scripts/workspace-local move 6
bindsym Mod4+Shift+7 exec ~/.config/sway/scripts/workspace-local move 7
bindsym Mod4+Shift+8 exec ~/.config/sway/scripts/workspace-local move 8
bindsym Mod4+Shift+9 exec ~/.config/sway/scripts/workspace-local move 9
bindsym Mod4+Shift+0 exec ~/.config/sway/scripts/workspace-local move 10

# Workspace navigation helpers
bindsym $mod+Tab exec swaymsg workspace next_on_output
bindsym $mod+Caps_Lock workspace back_and_forth

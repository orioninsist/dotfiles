# Catppuccin Mocha Theme for Yazi (~/.config/yazi/theme.toml)

[mgr]
cwd = { fg = "#94e2d5" }

# Hovered / Selected items
hovered         = { fg = "#1e1e2e", bg = "#89b4fa", bold = true }
preview_hovered = { bg = "#313244" }

# Find & Marker
find_keyword      = { fg = "#f9e2af", bold = true, italic = true }
find_position     = { fg = "#a6e3a1", bold = true }
marker_copied     = { fg = "#a6e3a1" }
marker_cut        = { fg = "#f38ba8" }
marker_marked     = { fg = "#f5c2e7" }
marker_selected   = { fg = "#f9e2af" }

# Count / Border
count_copied   = { fg = "#1e1e2e", bg = "#a6e3a1" }
count_cut      = { fg = "#1e1e2e", bg = "#f38ba8" }
count_selected = { fg = "#1e1e2e", bg = "#f9e2af" }

border_symbol = "│"
border_style  = { fg = "#585b70" }

[mode]
normal_main = { fg = "#1e1e2e", bg = "#89b4fa", bold = true }
normal_alt  = { fg = "#89b4fa", bg = "#313244" }
select_main = { fg = "#1e1e2e", bg = "#a6e3a1", bold = true }
select_alt  = { fg = "#a6e3a1", bg = "#313244" }
unset_main  = { fg = "#1e1e2e", bg = "#f2cdcd", bold = true }
unset_alt   = { fg = "#f2cdcd", bg = "#313244" }

[tabs]
active   = { fg = "#1e1e2e", bg = "#cba6f7", bold = true }
inactive = { fg = "#cdd6f4", bg = "#313244" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#89b4fa", bg = "#313244" }
progress_error  = { fg = "#f38ba8", bg = "#313244" }

# Permissions
perm_sep   = { fg = "#6c7086" }
perm_type  = { fg = "#cba6f7" }
perm_read  = { fg = "#f9e2af" }
perm_write = { fg = "#f38ba8" }
perm_exec  = { fg = "#a6e3a1" }

[select]
border   = { fg = "#89b4fa" }
active   = { fg = "#f5c2e7", bold = true }
inactive = { fg = "#cdd6f4" }

[input]
border   = { fg = "#cba6f7" }
title    = { fg = "#cdd6f4" }
value    = { fg = "#cdd6f4" }

[completion]
border   = { fg = "#89b4fa" }
active   = { fg = "#1e1e2e", bg = "#cba6f7", bold = true }
inactive = { fg = "#cdd6f4" }

[tasks]
border  = { fg = "#89b4fa" }
title   = { fg = "#cdd6f4" }
hovered = { fg = "#1e1e2e", bg = "#89b4fa", bold = true }

[which]
cols = 3
mask = { bg = "#181825" }
cand = { fg = "#89dceb" }
rest = { fg = "#9399b2" }
desc = { fg = "#f5c2e7" }
separator = "  "
separator_style = { fg = "#585b70" }

[help]
on      = { fg = "#a6e3a1" }
exec    = { fg = "#89dceb" }
desc    = { fg = "#cdd6f4" }
hovered = { bg = "#45475a", bold = true }

[filetype]
rules = [
  { mime = "image/*", fg = "#fab387" },
  { mime = "{video,audio}/*", fg = "#f9e2af" },
  { mime = "application/{zip,rar,7z*,tar,gzip,bzip2,xz,zstd}", fg = "#f38ba8" },
  { mime = "application/pdf", fg = "#eba0ac" },
  { mime = "text/*", fg = "#a6e3a1" },
  { url = "*/", fg = "#89b4fa" }
]

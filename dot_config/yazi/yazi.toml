[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_dir_first = true
show_hidden    = false

[preview]
wrap          = "no"
tab_size      = 2
max_width     = 1200
max_height    = 1200
image_delay   = 20
image_filter  = "triangle"
image_quality = 90

[tasks]
image_alloc = 1073741824
image_bound = [15000, 15000]

[opener]

image = [
  { run = "/usr/bin/swayimg %s", orphan = true, desc = "Swayimg", for = "unix" },
]


pdf = [
  { run = 'zathura %s', orphan = true, desc = "Zathura", for = "unix" },
]

docx = [
  { run = '"$HOME/.local/bin/orion-open-docx" %s1', orphan = true, desc = "Google Docs", for = "unix" },
]

xlsx = [
  { run = '"$HOME/.local/bin/orion-open-xlsx" %s1', orphan = true, desc = "Google Sheets", for = "unix" },
]

pptx = [
  { run = '"$HOME/.local/bin/orion-open-pptx" %s1', orphan = true, desc = "Google Slides", for = "unix" },
]


[[opener.open]]
run = "gio open %s1"
orphan = true
desc = "System default"
for = "unix"
[[opener.media]]
run = "/usr/bin/mpv -- %s"
orphan = true
desc = "MPV"
for = "unix"
[[opener.edit]]
# Yazi expands %s to the selected path. "$1" is a shell positional argument
# and was empty here, so AstroNvim opened an unnamed, blank buffer.
run = 'env NVIM_APPNAME=astronvim /usr/bin/nvim -- %s'
block = true
desc = "AstroNvim"
for = "unix"
[open]

[[open.prepend_rules]]
url = "*.docx"
use = "docx"

[[open.prepend_rules]]
url = "*.xlsx"
use = "xlsx"

[[open.prepend_rules]]
url = "*.pptx"
use = "pptx"

[[open.prepend_rules]]
url = "*.{md,markdown,txt,log,csv,tsv,py,sh,bash,js,ts,jsx,tsx,html,css,json,yaml,yml,toml,xml,ini,conf,rs,go,lua,sql}"
use = "edit"

[[open.prepend_rules]]
url = "*.{mp4,mkv,webm,mov,avi,m4v,flv,wmv,mp3,flac,wav,ogg,m4a,opus}"
use = "media"

[[open.prepend_rules]]
mime = "text/*"
use = "edit"

[[open.prepend_rules]]
mime = "video/*"
use = "media"

[[open.prepend_rules]]
mime = "audio/*"
use = "media"

[[open.prepend_rules]]
url = "*.{mp4,mkv,webm,mov,avi,m4v,flv,wmv}"
use = "media"
[[open.prepend_rules]]
url = "*.{MP4,MKV,WEBM,MOV,AVI,M4V}"
use = "media"
[[open.prepend_rules]]
url = "*.{md,markdown,txt,log,csv,tsv,py,sh,bash,js,ts,jsx,tsx,html,css,scss,json,jsonl,yaml,yml,toml,xml,ini,conf,c,h,cpp,hpp,rs,go,lua,sql,typ,mmd,d2}"
use = "edit"
[[open.prepend_rules]]
url = "*.{svg,SVG,png,jpg,jpeg,webp,gif,bmp,avif,tif,tiff}"
use = "image"
[[open.prepend_rules]]
mime = "application/{json,ndjson,javascript,wine-extension-ini}"
use = "edit"
[[open.prepend_rules]]
mime = "image/*"
use = "image"
[[open.prepend_rules]]
mime = "{audio,video}/*"
use = "media"
[[open.prepend_rules]]
mime = "application/pdf"
use = "pdf"

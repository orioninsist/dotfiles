# ==============================================================================
#  FUZZEL CONFIGURATION FILE (fuzzel.ini)
#  Theme: Catppuccin Mocha
#  Grounded in official Arch Linux Manual Documentation: fuzzel.ini(5)
# ==============================================================================

[main]
# Window appearance and layout
font=JetBrainsMono Nerd Font:size=11,monospace:size=11
dpi-aware=auto
use-bold=yes
prompt="❯ "
placeholder="Search applications or commands..."
icon-theme=Papirus
icons-enabled=yes
hide-before-typing=no
show-actions=yes

# Dimensions & Padding (in pixels / characters)
lines=12
width=38
horizontal-pad=20
vertical-pad=12
inner-pad=8
image-size-ratio=0.5

# Matching & Search settings
match-mode=fzf
fields=filename,name,generic,exec,keywords,categories
sort-result=yes
match-counter=yes

# Terminal used to launch terminal applications (e.g. htop)
# Configured for Foot terminal as requested
terminal=foot -a '{cmd}' -T '{cmd}' {cmd}

# Window positioning and behavior
anchor=center
layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes

# Performance and multi-threading
match-workers=4
render-workers=4

[colors]
# Catppuccin Mocha Palette (RGBA hex format without 0x prefix)
# Base / Background (with slight transparency for modern blur/compositor feel)
background=1e1e2edd

# Unselected item text (Text: #cdd6f4)
text=cdd6f4ff

# Informational message color
message=cdd6f4ff

# Prompt character color (Mauve: #cba6f7)
prompt=cba6f7ff

# Placeholder text color (Overlay0: #6c7086)
placeholder=6c7086ff

# Input query text color (Text: #cdd6f4)
input=cdd6f4ff

# Matched character highlight in unselected items (Peach: #fab387)
match=fab387ff

# Selected entry background (Surface1: #45475a)
selection=45475aff

# Selected entry text color (Text: #cdd6f4)
selection-text=cdd6f4ff

# Matched character highlight in selected item (Yellow: #f9e2af)
selection-match=f9e2afff

# Match counter color (Subtext0: #a6adc8)
counter=a6adc8ff

# Window border color (Mauve: #cba6f7)
border=cba6f7ff

[border]
# Border dimensions and corner curvature
width=2
radius=12
selection-radius=8

[dmenu]
# General-purpose picker / dmenu mode settings
mode=text
exit-immediately-if-empty=no

[key-bindings]
# Key bindings (XKB key names)
cancel=Escape Control+g Control+c
execute=Return KP_Enter
execute-or-next=Tab
cursor-left=Left Control+b
cursor-right=Right Control+f
cursor-home=Home Control+a
cursor-end=End Control+e
delete-prev=BackSpace Control+h
delete-line-backward=Control+u
delete-line-forward=Control+k
prev=Up Control+p
next=Down Control+n
prev-page=Page_Up
next-page=Page_Down
clipboard-paste=Control+v

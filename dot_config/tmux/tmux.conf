set -g window-status-format ' #I:#W#{?window_flags,#{window_flags},} '
set -g window-status-current-format ' #[bold]#I:#W#{?window_flags,#{window_flags},}#[default] '
set -g status-left '[#{session_name}] '
set -g status-left-length 30

# tmux plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatically save and restore tmux sessions
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Display pane numbers and titles
set -g pane-border-status off
set -g pane-border-format ' #[bold]Pane #{pane_index}#[default] | #{pane_title} '

# Initialize TPM (keep this line last)
run '/home/murat/.config/tmux/plugins/tpm/tpm'

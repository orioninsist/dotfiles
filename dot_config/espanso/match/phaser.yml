matches:
  # DOCSYNC
  #####

  - trigger: ":phaserdocs"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://docs.phaser.io/ --engine python --language en -o /home/murat/Library/Documents/Notes/Murat/Phaser/Documentation/docs.phaser.io

  # MERGE
  #####

  - trigger: ":phaserdocsmerge"
    replace: |
      cd /home/murat/Project/docsync/markdownMerge && \
      uv run mdmerge \
      /home/murat/Library/Documents/Notes/Murat/Phaser/Documentation/docs.phaser.io \
      --token-limit 1800000 \
      --reserve-tokens 50000 \
      --encoding o200k_base
matches:
  - trigger: ":astronvim"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://docs.astronvim.com/ --engine python --language en

  - trigger: ":astronvimmerge"
    replace: |
      cd /home/murat/Project/docsync/markdownMerge && \
      uv run mdmerge \
      /home/murat/Library/Documents/Documentation/docs.astronvim.com \
      --token-limit 1800000 \
      --reserve-tokens 50000 \
      --encoding o200k_base

matches:
  - trigger: ":docker"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://docs.docker.com/ --engine python --language en -o /home/murat/Library/Documents/Notes/Murat/Docker/Documentation/docs.docker.com

  - trigger: ":dockermerge"
    replace: |
      cd /home/murat/Project/docsync/markdownMerge && \
      uv run mdmerge \
      /home/murat/Library/Documents/Notes/Murat/Docker/Documentation/docs.docker.com \
      --token-limit 1800000 \
      --reserve-tokens 50000 \
      --encoding o200k_base
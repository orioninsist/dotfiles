matches:
  - trigger: ":typst"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://typst.app/ --engine python --language en

  - trigger: ":typstmerge"
    replace: |
      cd /home/murat/Project/docsync/markdownMerge && \
      uv run mdmerge \
      /home/murat/Library/Documents/Documentation/typst.app \
      --token-limit 1800000 \
      --reserve-tokens 50000 \
      --encoding o200k_base

# DOCSYNC
matches:
  - trigger: ":aiDocs"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://ai.google.dev --engine python --language en -o /home/murat/Library/Documents/Notes/Murat/Google/Documentation/ai.google.dev

  - trigger: ":googlesearch"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://developers.google.com/search/ --engine python --language en -o /home/murat/Library/Documents/Notes/Murat/Google/Documentation/developers.google.com-search

  - trigger: ":gemininotebookDocs"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://support.google.com/gemininotebook --engine python --language en -o /home/murat/Library/Documents/Notes/Murat/Google/Documentation/support.google.com-gemininotebook

  - trigger: ":youtubeDocs"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://support.google.com/youtube --engine python --language en -o /home/murat/Library/Documents/Notes/Murat/Google/Documentation/support.google.com-youtube

  - trigger: ":androidDocs"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://developer.android.com --engine python --language en -o /home/murat/Library/Documents/Notes/Murat/Google/Documentation/developer.android.com

  - trigger: ":deepmindDocs"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://deepmind.google/ --engine python --language en -o /home/murat/Library/Documents/Notes/Murat/Google/Documentation/deepmind.google

  - trigger: ":googledevelopersDocs"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://developers.google.com/ --engine python --language en -o /home/murat/Library/Documents/Notes/Murat/Google/Documentation/developers.google.com


# MERGE
  - trigger: ":googleaimerge"
    replace: |
      cd /home/murat/Project/docsync/markdownMerge && \
      uv run mdmerge \
      /home/murat/Library/Documents/Notes/Murat/Google/Documentation/ai.google.dev \
      --token-limit 1800000 \
      --reserve-tokens 50000 \
      --encoding o200k_base


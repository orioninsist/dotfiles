matches:
  - trigger: ":hugodocs"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://gohugo.io/ --engine python --language en -o /home/murat/Library/Documents/Notes/Murat/Hugo/Documentation/gohugo.io

  - trigger: ":godocsmerge"
    replace: |
      cd /home/murat/Project/docsync/markdownMerge && \
      uv run mdmerge \
      /home/murat/Library/Documents/Notes/Murat/Hugo/Documentation/gohugo.io \
      --token-limit 1800000 \
      --reserve-tokens 50000 \
      --encoding o200k_base
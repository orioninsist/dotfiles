matches:
  - trigger: ":tmux"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://github.com/tmux/tmux/wiki --engine python --language en

  - trigger: ":tmuxmerge"
    replace: |
      cd /home/murat/Library/Documents/markdownMerge&& uv run mdmerge \
      /home/murat/Library/Documents/Documentation/github.com-tmux-tmux-wiki \
      --token-limit 1800000 \
      --reserve-tokens 50000 \
      --encoding o200k_base

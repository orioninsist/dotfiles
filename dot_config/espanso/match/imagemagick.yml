matches:

  - trigger: ":imagemagick"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://imagemagick.org/ --engine python --language en

  - trigger: ":imagemagickmerge"
    replace: |
      cd /home/murat/Library/Documents/markdownMerge&& uv run mdmerge \
      /home/murat/Library/Documents/Documentation/imagemagick.org \
      --token-limit 1800000 \
      --reserve-tokens 50000 \
      --encoding o200k_base

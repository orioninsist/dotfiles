matches:
  - trigger: ":neovim"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://neovim.io/ --engine python --language en -o /home/murat/Library/Documents/Notes/Murat/Neovim/Documentation/neovim.io

  - trigger: ":neovimmerge"
    replace: |
      cd /home/murat/Project/docsync/markdownMerge && \
      uv run mdmerge \
      /home/murat/Library/Documents/Notes/Murat/Neovim/Documentation/neovim.io \
      --token-limit 1800000 \
      --reserve-tokens 50000 \
      --encoding o200k_base
matches:
  - trigger: ":neovim"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://neovim.io/ --engine python --language en

  - trigger: ":neovimmerge"
    replace: |
      cd /home/murat/Library/Documents/markdownMerge&& uv run mdmerge \
      /home/murat/Library/Documents/Documentation/neovim.io \
      --token-limit 1800000 \
      --reserve-tokens 50000 \
      --encoding o200k_base

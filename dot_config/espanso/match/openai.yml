  - trigger: :openaidevelopersmerge
    replace: |
      cd /home/murat/Project/docsync/markdownMerge && \
      uv run mdmerge \
      /home/murat/Library/Documents/Notes/Murat/Openai/Documentation/developers.openai.com \
      --token-limit 1800000 \
      --reserve-tokens 50000 \
      --encoding o200k_base


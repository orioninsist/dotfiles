matches:
  - trigger: ":developersDocs"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://developers.openai.com/ --engine python --language en

  - trigger: ":academyDocs"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://academy.openai.com/ --engine python --language en

  - trigger: ":helpDocs"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://help.openai.com/en --engine python --language en --headful

  - trigger: ":chatgptlearnDocs"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://learn.chatgpt.com/ --engine python --language en

  - trigger: ":openaiDocs"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://openai.com/ --engine python --language en

  - trigger: ":platformDocs"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://platform.openai.com/ --engine python --language en



# ============================================================
# markdownMerge project
# Markdown docs -> LLM context packages
#
# Project:
# /home/murat/Project/docsync/markdownMerge
#
# Output name:
# Automatically derived from INPUT_DIRECTORY name
#
# Tokenizer:
# o200k_base
#
# Output:
# - Markdown context files
# - manifest.json
# - summary.txt
# - validation.txt
# ============================================================

  - trigger: :openaidevelopersmerge
    replace: |
      cd /home/murat/Library/Documents/markdownMerge&& uv run mdmerge \
      /home/murat/Library/Documents/Documentation/developers.openai.com \
      --token-limit 1800000 \
      --reserve-tokens 50000 \
      --encoding o200k_base

  - trigger: :openaiacademymerge
    replace: |
      cd /home/murat/Library/Documents/markdownMerge&& uv run mdmerge \
      /home/murat/Library/Documents/Documentation/academy.openai.com \
      --token-limit 1800000 \
      --reserve-tokens 50000 \
      --encoding o200k_base

  - trigger: :openaihelpmerge
    replace: |
      cd /home/murat/Library/Documents/markdownMerge&& uv run mdmerge \
      /home/murat/Library/Documents/Documentation/help.openai.com-en \
      --token-limit 1800000 \
      --reserve-tokens 50000 \
      --encoding o200k_base

  - trigger: :chatgptlearnmerge
    replace: |
      cd /home/murat/Library/Documents/markdownMerge&& uv run mdmerge \

matches:
  - trigger: ":developersDocs"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://developers.openai.com/ --engine python --language en -o /home/murat/Library/Documents/Notes/Murat/Openai/Documentation/developers.openai.com

  - trigger: ":academyDocs"

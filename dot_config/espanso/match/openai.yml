# ============================================================
# markdownMerge checks
# Check generated AI packages
# ============================================================

  - trigger: :openaimergecheck
    replace: |
      cat /home/murat/Media/8-Document/markdownMerge/openai.com/summary.txt && \
      echo && \
      cat /home/murat/Media/8-Document/markdownMerge/openai.com/validation.txt

  - trigger: :openaimergemanifest
    replace: |
      jq . /home/murat/Media/8-Document/markdownMerge/openai.com/manifest.json



  # ============================================================
  # markdownParts project
  # Markdown docs -> Exact number of merged Markdown parts
  #
  # Project:
  # /home/murat/Project/docsync/markdownParts
  #
  # Output:
  # /home/murat/Media/8-Document/markdownPart/
  #
  # Output name:
  # Automatically derived from INPUT_DIRECTORY name
  #
  # Split:
  # By Markdown file count
  #
  # Output:
  # - Only merged .md files
  # ============================================================

  - trigger: :openaidevelopersparts
    replace: |
      cd /home/murat/Project/docsync/markdownParts && uv run mdparts \
      /home/murat/Library/Documents/Documentation/developers.openai.com \
      --parts 2


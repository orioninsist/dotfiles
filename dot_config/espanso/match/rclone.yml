matches:
  - trigger: ":rclone"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://rclone.org/ --engine python --language en -o /home/murat/Library/Documents/Notes/Murat/Rclone/Documentation/rclone.org

  - trigger: ":rclonemerge"
    replace: |
      cd /home/murat/Project/docsync/markdownMerge && \
      uv run mdmerge \
      /home/murat/Library/Documents/Notes/Murat/Rclone/Documentation/rclone.org \
      --token-limit 1800000 \
      --reserve-tokens 50000 \
      --encoding o200k_base

  - trigger: ":rclonelog"
    replace: |
      journalctl --user -u rclone-backup.service -f
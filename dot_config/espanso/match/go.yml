matches:
  - trigger: ":godocs"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://go.dev/ --engine python --language en -o /home/murat/Library/Documents/Notes/Murat/Go/Documentation/go.dev

  - trigger: ":godocsmerge"
    replace: |
      cd /home/murat/Project/docsync/markdownMerge && \
      uv run mdmerge \
      /home/murat/Library/Documents/Notes/Murat/Go/Documentation/go.dev \
      --token-limit 1800000 \
      --reserve-tokens 50000 \
      --encoding o200k_base
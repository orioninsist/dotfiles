matches:

  - trigger: ":remotion"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://www.remotion.dev/ --engine python --language en

  - trigger: ":remotionmerge"
    replace: |
      cd /home/murat/Library/Documents/markdownMerge&& uv run mdmerge \
      /home/murat/Library/Documents/Documentation/www.remotion.dev \
      --token-limit 1800000 \
      --reserve-tokens 50000 \
      --encoding o200k_base

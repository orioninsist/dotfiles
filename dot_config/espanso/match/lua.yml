matches:
  - trigger: ":lua"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://www.lua.org/manual/5.5/ --engine python --language en -o /home/murat/Library/Documents/Notes/Murat/Lua/Documentation/www.lua.org

  - trigger: ":luamerge"
    replace: |
      cd /home/murat/Project/docsync/markdownMerge && \
      uv run mdmerge \
      /home/murat/Library/Documents/Notes/Murat/Lua/Documentation/www.lua.org \
      --token-limit 1800000 \
      --reserve-tokens 50000 \
      --encoding o200k_base
matches:
  - trigger: ":chezmoi"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://www.chezmoi.io/ --engine python --language en -o /home/murat/Library/Documents/Notes/Murat/Chezmoi/Documentation/www.chezmoi.io

  - trigger: ":chezmoimerge"
    replace: |
      cd /home/murat/Project/docsync/markdownMerge && \
      uv run mdmerge \
      /home/murat/Library/Documents/Notes/Murat/Chezmoi/Documentation/www.chezmoi.io \
      --token-limit 1800000 \
      --reserve-tokens 50000 \
      --encoding o200k_base
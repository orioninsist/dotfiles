matches:
  - trigger: ":pythondocs"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://docs.python.org/3/ --engine python --language en -o /home/murat/Library/Documents/Notes/Murat/Python/Documentation/docs.python.org

  - trigger: ":pythondocsmerge"
    replace: |
      cd /home/murat/Project/docsync/markdownMerge && \
      uv run mdmerge \
      /home/murat/Library/Documents/Notes/Murat/Python/Documentation/docs.python.org \
      --token-limit 1800000 \
      --reserve-tokens 50000 \
      --encoding o200k_base
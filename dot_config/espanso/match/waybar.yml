matches:
  - trigger: ":waybar"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://github.com/Alexays/Waybar/wiki --engine python --language en

  - trigger: ":waybarmerge"
    replace: |
      cd /home/murat/Project/docsync/markdownMerge && \
      uv run mdmerge \
      /home/murat/Library/Documents/Documentation/github.com-Alexays-Waybar-wiki \
      --token-limit 1800000 \
      --reserve-tokens 50000 \
      --encoding o200k_base

matches:
  - trigger: ":archwiki"
    replace: |
      cd /home/murat/Project/docsync && uv run docsync sync https://wiki.archlinux.org --engine python --language en -o /home/murat/Library/Documents/Notes/Murat/Archlinux/Documentation/wiki.archlinux.org

  - trigger: ":archwikimerge"
    replace: |
      cd /home/murat/Project/docsync/markdownMerge && \
      uv run mdmerge \
      /home/murat/Library/Documents/Notes/Murat/Archlinux/Documentation/wiki.archlinux.org \
      --token-limit 1800000 \
      --reserve-tokens 50000 \
      --encoding o200k_base
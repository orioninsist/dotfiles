# Orion Kitty configuration
# Migrated from the previous Foot configuration.

shell /bin/bash

# Font
font_family      GoogleSansCode Nerd Font Mono
bold_font        GoogleSansCode Nerd Font Mono Bold
italic_font      GoogleSansCode Nerd Font Mono Italic
bold_italic_font GoogleSansCode Nerd Font Mono Bold Italic
font_size 12.0

# Window
window_padding_width 12 10
remember_window_size no
hide_window_decorations yes

# Cursor
cursor_shape beam
cursor_beam_thickness 2.0
cursor_blink_interval 0
cursor_stop_blinking_after 0

# Scrollback
scrollback_lines 20000
wheel_scroll_multiplier 3.0

# Mouse
mouse_hide_wait 0

# Clipboard
copy_on_select clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Font size
map ctrl+plus  change_font_size all +1.0
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

# New Kitty window
map ctrl+shift+n new_os_window

# Clear screen + complete scrollback
map ctrl+shift+l send_text all printf\x20'\\033[2J\\033[3J\\033[H'\x20>\x20/dev/tty\x0a

# Copy complete Kitty screen + scrollback
map ctrl+shift+y launch --type=background --stdin-source=@screen_scrollback ~/.config/wayland/scripts/kitty-copy-scrollback

# URL handling
open_url_with default

# Terminal bell
enable_audio_bell no
visual_bell_duration 0

# Catppuccin Mocha palette migrated from Foot
background #1e1e2e
foreground #cdd6f4

color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #cba6f7
color6  #94e2d5
color7  #bac2de

color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #cba6f7
color14 #94e2d5
color15 #a6adc8

background_opacity 1.0

